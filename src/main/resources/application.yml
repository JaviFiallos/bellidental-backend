spring:
  application:
    name: bellidental-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/bellidental
    username: bellidental
    password: bellidental_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

application:
  security:
    jwt:
      secret: ${JWT_SECRET:3d8f7a2e1b5c4d9f0e6a3b8c2d7f1e4a5b9c0d3e6f2a7b8c1d4e5f9a0b3c6d9}
      expiration: ${JWT_EXPIRATION:86400000}  # 24 horas en ms
