spring:
  application:
    name: bellidental-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/bellidental
    username: bellidental
    password: bellidental_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
      org.hibernate.envers.audit_table_suffix: _aud
      org.hibernate.envers.revision_field_name: rev
      org.hibernate.envers.revision_type_field_name: revtype

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

application:
  security:
    jwt:
      secret: ${JWT_SECRET:3d8f7a2e1b5c4d9f0e6a3b8c2d7f1e4a5b9c0d3e6f2a7b8c1d4e5f9a0b3c6d9}
      expiration: ${JWT_EXPIRATION:86400000}  # 24 horas en ms
    document-link:
      ttl-seconds: ${DOCUMENT_LINK_TTL_SECONDS:300}
  bot:
    api-key: ${BOT_API_KEY:}
    privacy-notice-version: "v1"
    public-treatments:
      - D0150
      - D1110
      - D2330
    urgent-specialty-id: 1
    limits:
      max-active-per-phone: 3
      change-min-hours: 2
  clinic:
    name: Bellidental Clínica Dental   # provisional
    tagline: Creamos bellas sonrisas   # provisional
    address: Dirección por definir      # provisional
    phone: "0000000000"                 # provisional
    zone: America/Guayaquil
    hours:
      - "Lunes a viernes 09:00–13:00 y 15:00–19:00"
      - "Sábados 09:00–13:00"
    payment-methods:
      - "Efectivo"
      - "Transferencia"
    reception-whatsapp: "593000000000"
    after-hours-phone: "593000000000"
    services:
      - "Odontología general"
      - "Endodoncia"
      - "Ortodoncia"
      - "Resinas"
      - "Exodoncia de cordales"
      - "Blanqueamiento"
      - "Prótesis"
      - "Profilaxis"
      - "Periodoncia"
      - "Odontopediatría"
    social:
      facebook: "Bellidental"
      instagram: "@bellidental"
      x: ""
      email: "contacto@bellidental.com"
